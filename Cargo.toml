[workspace]
resolver = "3"
members = ["crates/plex-core", "crates/plex-cli", "crates/plex-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jhofker/plex-grabber"

[workspace.dependencies]
plex-core = { path = "crates/plex-core" }
plex-web = { path = "crates/plex-web" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
http-body-util = "0.1"
indicatif = "0.18"
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tower = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
